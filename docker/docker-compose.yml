# Base stack — supporting services only.
#
# LOCAL ONLY. This stack runs on a developer machine under plain
# `docker compose`. There is no Swarm, no registry, no remote host and no
# deployment path in this repository; docs/SPEC.md §42 still describes the
# eventual deployment target, which is deferred, not abandoned.
#
# Compose with one or more overlays:
#   -f docker-compose.local.yml   → api/web from source with hot reload
#   -f docker-compose.seed.yml    → one-shot migrate + seed + bucket create
#   -f docker-compose.debug.yml   → adds the Bun inspector to the api
#
# Env layering (later files override earlier files):
#   env/base.env         → committed, non-secret defaults
#   env/${APP_ENV}.env   → committed, per-environment overrides (local)
#   env/.env (optional)  → gitignored; the only place a real secret may live
#
# Selection is via the APP_ENV shell variable, defaulting to `local`.
#
# WHY bridge AND NO `deploy:` KEYS. Praxis v1 declares an `overlay` network
# here because its remote deploys run on Swarm, and overrides it back to bridge
# in its local overlay. An overlay network cannot be created without an
# initialised Swarm, so a v1-shaped base file cannot be brought up with plain
# `docker compose up` at all. With no Swarm consumer left in v2 the override is
# pure indirection, and a base file that only works when an overlay rescues it
# is a trap for whoever next brings up a subset of services.
#
# Everything is named `praxis2` (project, network, volumes, images) and every
# published port sits in a block distinct from v1's, so both stacks can run on
# one machine. See env/base.env for the ports and env/README.md for why that
# matters more than the names.

name: praxis2

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - env/base.env
      - env/${APP_ENV:-local}.env
      - path: env/.env
        required: false
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - praxis2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio:
    # Chainguard's MinIO build: the entrypoint is /usr/bin/minio and it runs as
    # the non-root uid 65532. It also ships `mc` and `sh`, which the seed
    # overlay uses to create buckets.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - env/base.env
      - env/${APP_ENV:-local}.env
      - path: env/.env
        required: false
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    networks:
      - praxis2
    healthcheck:
      # The Chainguard image has no curl or wget, but it does ship bash, whose
      # /dev/tcp is enough HTTP to probe the liveness endpoint. `$$` defers
      # expansion to the container's shell.
      test:
        [
          "CMD",
          "bash",
          "-c",
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /minio/health/live HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && read -r status <&3 && [[ "$$status" == *" 200 "* ]]',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Shared API response cache. The api is a single process locally, so this is
  # not yet load-bearing — it is here because the cache middleware (§38) expects
  # it and because a developer should see the same cache semantics the deployed
  # stack will have.
  #
  # Reached over the `praxis2` network as redis://redis:6379 (REDIS_URL in
  # env/base.env). Every v2 key carries the `praxis2:` prefix, so v1 and v2
  # cannot read or evict each other's entries even pointed at one instance.
  redis:
    image: redis:7-alpine
    # allkeys-lru plus a memory ceiling means a traffic spike evicts cold
    # entries instead of OOM-killing the container; every entry has a TTL
    # anyway, so an eviction is only ever a cache miss. The light RDB snapshot
    # keeps the cache warm across a restart.
    command: [
        "redis-server",
        "--save",
        "300",
        "100",
        "--appendonly",
        "no",
        "--maxmemory",
        "${REDIS_MAXMEMORY:-256mb}",
        "--maxmemory-policy",
        "allkeys-lru",
        # Empty locally, where the container is not reachable off-box and an
        # unset password keeps `redis-cli` frictionless. `requirepass ""` is how
        # redis spells "no password", so one command line serves both cases.
        "--requirepass",
        "${REDIS_PASSWORD:-}",
      ]
    ports:
      # Published, unlike the deployed case, so `redis-cli -p 6380` can inspect
      # keys from the host.
      - "${REDIS_PORT:-6380}:6379"
    env_file:
      - env/base.env
      - env/${APP_ENV:-local}.env
      - path: env/.env
        required: false
    volumes:
      - redis_data:/data
    networks:
      - praxis2
    healthcheck:
      # `$$` defers expansion to the container's shell, which reads
      # REDIS_PASSWORD from env_file. The branch matters: `redis-cli -a ""`
      # sends AUTH to a server that has no password set, which errors — so an
      # unauthenticated local container would otherwise never report healthy.
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi',
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  praxis2:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  redis_data:
